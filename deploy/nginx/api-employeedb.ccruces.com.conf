# Install only after DNS and the TLS certificate exist. Laravel runs directly
# behind Nginx/PHP-FPM; no arbitrary proxy headers are trusted by the application.
server {
    listen 80;
    server_name api-employeedb.ccruces.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://api-employeedb.ccruces.com$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api-employeedb.ccruces.com;
    root /var/www/employees-db/backend/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/api-employeedb.ccruces.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-employeedb.ccruces.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 16m;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Do not log query strings (credentials belong only in the JSON login body).
    access_log off;
    error_log /var/log/nginx/employees-db-error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ { deny all; }
    location ~ /\. { deny all; }
}

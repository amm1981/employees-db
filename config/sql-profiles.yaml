private-lan:
  serverEnv: SQL_HOST
  portEnv: SQL_PORT
  userEnv: SQL_USER
  passwordEnv: SQL_PASSWORD
  encrypt: true
  trustServerCertificate: false
  # Explicit user instruction: encrypted SQL connection with trusted certificate.
  inspectionTrustServerCertificate: true
  extractionTrustServerCertificate: true
  connectionTimeoutMs: 15000
